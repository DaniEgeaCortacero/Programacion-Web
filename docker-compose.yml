version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: practica
      MYSQL_DATABASE: practica
      MYSQL_USER: practica
      MYSQL_PASSWORD: practica
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  web:
    image: php:8.3-apache
    container_name: apache_php
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma
    restart: always
    environment:
      PMA_HOST: practica
      MYSQL_ROOT_PASSWORD: practica
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
